<section class="wrap product-page">
  <div class="product-hero" aria-hidden="true"><div class="desk big" id="desk-art"><span class="leg"></span><span class="leg"></span></div></div>
  <form class="product-form" action="/cart/add" method="post" id="product-form">
    <span class="eyebrow">DRIFTWOOD RISE</span>
    <h1>Driftwood Rise</h1>
    <p class="price" id="price">$749</p>
    <fieldset class="options" data-option="Size">
      <legend>Size: <span id="size-label">60 in</span></legend>
      <label class="opt"><input type="radio" name="size" value="48 in" data-price="649">48 in</label>
      <label class="opt"><input type="radio" name="size" value="60 in" data-price="749" checked>60 in</label>
      <label class="opt"><input type="radio" name="size" value="72 in" data-price="899">72 in</label>
    </fieldset>
    <fieldset class="options" data-option="Finish">
      <legend>Finish: <span id="finish-label">Walnut</span></legend>
      <label class="opt"><input type="radio" name="finish" value="Walnut" checked>Walnut</label>
      <label class="opt"><input type="radio" name="finish" value="Oak">Oak</label>
      <label class="opt"><input type="radio" name="finish" value="Black">Black</label>
    </fieldset>
    <div class="qty-row"><label for="qty">Qty</label><input id="qty" name="qty" type="number" min="1" max="500" value="1"></div>
    <button type="submit" class="btn btn-dark btn-lg" data-sqid-label="add_to_cart" data-sqid-type="key_event">Add to cart</button>
    <p class="hint">Hover and switch between sizes a few times without adding to cart. The panel's Live tab shows what the SDK saw.</p>
  </form>
</section>
